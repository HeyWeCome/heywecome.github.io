---
layout: default
author_profile: false
---

<div id="main" class="{% unless page.url == '/' %}no-sidebar{% endunless %}" role="main">
  {% if page.url == "/" %}
  {% include sidebar.html %}
  {% endif %}

  <div class="archive">
    <h1 class="page__title">{{ page.title }}</h1>
    {% include base_path %}
    {% for post in page.posts %}
      {% include archive-single.html %}
    {% endfor %}
  </div>
</div>
